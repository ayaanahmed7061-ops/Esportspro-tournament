<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPORTS PRO – Free Fire Tournaments</title>
<meta name="description" content="Join Free Fire tournaments, win prizes and get room details instantly on ESPORTS PRO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader" class="loader"><div class="spinner"></div><p>Loading ESPORTS PRO…</p></div>

<header class="topbar">
  <div class="brand"><span class="b-red">ESPORTS</span> <span class="b-blue">PRO</span></div>
  <button id="logoutBtn" class="btn btn-ghost btn-sm hidden">Logout</button>
</header>

<main>
  <!-- AUTH -->
  <section id="view-auth" class="view hidden">
    <div class="hero">
      <h1>DOMINATE THE <span class="b-red">BATTLEGROUND</span></h1>
      <p>Free Fire tournaments. Real prizes. Instant room details.</p>
    </div>
    <div class="card auth-card">
      <div class="tabs">
        <button class="tab active" data-auth="login">Login</button>
        <button class="tab" data-auth="signup">Sign Up</button>
      </div>
      <form id="loginForm" class="form">
        <label>Email<input type="email" id="loginEmail" required autocomplete="email"></label>
        <label>Password<input type="password" id="loginPass" required autocomplete="current-password"></label>
        <button class="btn btn-primary" type="submit">Login</button>
        <button class="link-btn" type="button" id="forgotBtn">Forgot password?</button>
      </form>
      <form id="signupForm" class="form hidden">
        <label>Player Name<input type="text" id="suName" required maxlength="30"></label>
        <label>Free Fire UID<input type="text" id="suUid" required inputmode="numeric" pattern="[0-9]{5,15}" title="5–15 digits"></label>
        <label>Email<input type="email" id="suEmail" required autocomplete="email"></label>
        <label>Password<input type="password" id="suPass" required minlength="6" autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit">Create Account</button>
      </form>
      <p id="authMsg" class="msg"></p>
    </div>
  </section>

  <!-- TOURNAMENTS -->
  <section id="view-home" class="view hidden">
    <h2 class="section-title">Tournaments</h2>
    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="upcoming">Upcoming</button>
      <button class="chip" data-filter="live">Live</button>
      <button class="chip" data-filter="completed">Completed</button>
    </div>
    <div id="tournamentList" class="list"></div>
  </section>

  <!-- MY MATCHES -->
  <section id="view-matches" class="view hidden">
    <h2 class="section-title">My Matches</h2>
    <div id="matchList" class="list"></div>
  </section>

  <!-- PROFILE -->
  <section id="view-profile" class="view hidden">
    <h2 class="section-title">My Profile</h2>
    <div class="card">
      <form id="profileForm" class="form">
        <label>Player Name<input type="text" id="pName" required maxlength="30"></label>
        <label>Free Fire UID<input type="text" id="pUid" required inputmode="numeric" pattern="[0-9]{5,15}" title="5–15 digits"></label>
        <label>Email<input type="email" id="pEmail" disabled></label>
        <button class="btn btn-primary" type="submit">Save Profile</button>
      </form>
      <p id="profileMsg" class="msg"></p>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="view-admin" class="view hidden">
    <h2 class="section-title">Admin Panel</h2>
    <div class="card">
      <h3 id="tFormTitle">Add Tournament</h3>
      <form id="tForm" class="form">
        <input type="hidden" id="tId">
        <label>Tournament Name<input type="text" id="tName" required maxlength="60"></label>
        <div class="row">
          <label>Date<input type="date" id="tDate" required></label>
          <label>Time<input type="time" id="tTime" required></label>
        </div>
        <label>Map
          <select id="tMap" required>
            <option>Bermuda</option><option>Purgatory</option><option>Kalahari</option><option>Alpine</option><option>Nexterra</option><option>Solara</option>
          </select>
        </label>
        <div class="row">
          <label>Entry Fee (₹)<input type="number" id="tFee" min="0" required></label>
          <label>Prize Pool (₹)<input type="number" id="tPrize" min="0" required></label>
        </div>
        <label>Status
          <select id="tStatus"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="completed">Completed</option></select>
        </label>
        <button class="btn btn-primary" type="submit" id="tSubmit">Add Tournament</button>
        <button class="btn btn-ghost hidden" type="button" id="tCancel">Cancel Edit</button>
      </form>
      <p id="adminMsg" class="msg"></p>
    </div>
    <h3 class="section-sub">All Tournaments</h3>
    <div id="adminList" class="list"></div>
  </section>
</main>

<nav id="bottomNav" class="bottom-nav hidden">
  <button data-view="home" class="active"><span>🏆</span>Tournaments</button>
  <button data-view="matches"><span>🎮</span>My Matches</button>
  <button data-view="profile"><span>👤</span>Profile</button>
  <button data-view="admin" id="adminNav" class="hidden"><span>⚙️</span>Admin</button>
</nav>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="x" id="modalClose" aria-label="Close">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<!-- Firebase Compat SDK (loaded BEFORE app.js) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
